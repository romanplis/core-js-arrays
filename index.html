<body>
    <script>
/**
 * Checks if all strings in an array have the same length.
 *
 * @param {string[]} arr - The array of strings to be checked.
 * @return {boolean} - True if all strings have the same length, false otherwise.
 *
 * @example
 *    isSameLength(['orange', 'banana', 'cherry']) => true
 *    isSameLength(['cat', 'dog', 'elephant']) => false
 */
function isSameLength(arr) {
    const etalon = arr[0].length;
    const newArr = arr.filter(item => item.length !== etalon);
    console.log(!(newArr.length > 0));  
}
isSameLength(['orange', 'banana', 'cherry']);
isSameLength(['cat', 'dog', 'elephant']);
    </script>
    
</body>
